<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Pro Max</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="splash">FITNESS PRO MAX</div>

<div class="top">Hoş geldin Türk David Laid</div>

<div id="home" class="page">
    <div class="card hero">
        <h3>Hedef Kilo</h3>
        <input id="goalInput" placeholder="örn: 75">
        <button onclick="setGoal()">Hedefi Kaydet</button>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <p id="goalText">Hedef: -</p>
    </div>

    <div class="card">
        <h3>Bugünkü Kilo</h3>
        <p id="todayWeight">-</p>
    </div>

    <div class="card">
        <h3>Streak</h3>
        <p id="streak">0 gün 🔥</p>
    </div>

    <div class="card">
        <h3>Bench PR</h3>
        <p id="benchMax">-</p>
    </div>

    <div class="card">
        <h3>Durum</h3>
        <p id="status">-</p>
    </div>
</div>

<div id="kilo" class="page hidden">
    <div class="card">
        <h3>Kilo Ekle</h3>
        <input id="weightInput" placeholder="kg">
        <button onclick="addWeight()">Kaydet</button>
    </div>

    <div class="card">
        <canvas id="weightChart"></canvas>
    </div>
</div>

<div id="agirlik" class="page hidden">
    <div class="card">
        <h3>Bench</h3>
        <input id="benchInput" placeholder="kg">
        <button onclick="addLift('bench')">Ekle</button>
    </div>

    <div class="card">
        <h3>Squat</h3>
        <input id="squatInput" placeholder="kg">
        <button onclick="addLift('squat')">Ekle</button>
    </div>
</div>

<div id="stats" class="page hidden">
    <div class="card">
        <h3>Progress</h3>
        <canvas id="liftChart"></canvas>
    </div>

    <div class="card">
        <h3>Analiz</h3>
        <p id="weekly">-</p>
    </div>
</div>

<div class="bottom-nav">
    <button onclick="show('home')">🏠</button>
    <button onclick="show('kilo')">⚖️</button>
    <button onclick="show('agirlik')">🏋️</button>
    <button onclick="show('stats')">📊</button>
</div>

<script src="script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}


</script>

</body>
</html>
