<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spor Takip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🏋️ Spor Takip</h1>
    <p class="sub">Kendi gelişimini takip et</p>

    <div class="card">
        <h2>📅 Kilo Ekle</h2>
        <input id="kilo" placeholder="Bugünkü kilo">
        <button onclick="kiloEkle()">Ekle</button>
    </div>

    <div class="card">
        <h2>🏋️ Ağırlık Ekle</h2>
        <input id="hareket" placeholder="Hareket (bench vs)">
        <input id="agirlik" placeholder="Ağırlık (kg)">
        <button onclick="agirlikEkle()">Ekle</button>
    </div>

    <div class="card">
        <h2>📊 Kayıtlar</h2>
        <div id="liste"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
