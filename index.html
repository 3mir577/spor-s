<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness Pro Max</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
</head>

<body>

<div id="splash">FITNESS PRO MAX</div>

<div class="top">Hoş geldin Türk David Laid</div>

<!-- HOME -->
<div id="home" class="page">

    <div class="card hero">
        <h3>Hedef Kilo</h3>
        <input id="goalInput" placeholder="örn: 75">
        <button onclick="setGoal()">Hedefi Kaydet</button>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <p id="goalText">Hedef: -</p>
    </div>

    <div class="card">
        <h3>Bugünkü Kilo</h3>
        <p id="todayWeight">-</p>
    </div>

    <div class="card">
        <h3>Streak</h3>
        <p id="streak">0 gün 🔥</p>
    </div>

    <div class="card">
        <h3>Bench PR</h3>
        <p id="benchMax">-</p>
    </div>

</div>

<!-- KILO -->
<div id="kilo" class="page hidden">
    <div class="card">
        <h3>Kilo Ekle</h3>
        <input id="weightInput" placeholder="kg">
        <button onclick="addWeight()">Kaydet</button>
    </div>

    <div class="card">
        <canvas id="weightChart"></canvas>
    </div>
</div>

<!-- AGIRLIK -->
<div id="agirlik" class="page hidden">

    <div class="card">
        <h3>Plate Incline Press</h3>
        <input id="plate_incline_pressInput" placeholder="kg">
        <button onclick="addLift('plate_incline_press')">Kaydet</button>
    </div>

    <div class="card">
        <h3>Smith Low Incline Press</h3>
        <input id="smith_low_incline_pressInput" placeholder="kg">
        <button onclick="addLift('smith_low_incline_press')">Kaydet</button>
    </div>

    <div class="card">
        <h3>Chest Fly</h3>
        <input id="chest_flyInput" placeholder="kg">
        <button onclick="addLift('chest_fly')">Kaydet</button>
    </div>

    <div class="card">
        <h3>Shoulder Press</h3>
        <input id="machine_shoulder_pressInput" placeholder="kg">
        <button onclick="addLift('machine_shoulder_press')">Kaydet</button>
    </div>

    <div class="card">
        <h3>Lateral Raise</h3>
        <input id="lateral_raiseInput" placeholder="kg">
        <button onclick="addLift('lateral_raise')">Kaydet</button>
    </div>

    <div class="card">
        <h3>Skullcrusher</h3>
        <input id="skullcrusherInput" placeholder="kg">
        <button onclick="addLift('skullcrusher')">Kaydet</button>
    </div>

</div>

<!-- STATS -->
<div id="stats" class="page hidden">
    <div class="card">
        <h3>Progress</h3>
        <canvas id="weightChart"></canvas>
    </div>

    <div class="card">
        <h3>Bench Chart</h3>
        <canvas id="liftChart"></canvas>
    </div>
</div>

<div class="bottom-nav">
    <button onclick="show('home')">🏠</button>
    <button onclick="show('kilo')">⚖️</button>
    <button onclick="show('agirlik')">🏋️</button>
    <button onclick="show('stats')">📊</button>
</div>

<script src="./script.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
