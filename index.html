<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spor Takip</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
    <h1>🏋️ Spor Paneli</h1>
</div>

<div class="container">

    <!-- ANA MENÜ -->
    <div class="card">
        <h2>📊 Özet</h2>
        <p id="bugunKilo">Bugünkü kilo: -</p>
        <p id="benchMax">Bench Max: -</p>
        <p id="squatMax">Squat Max: -</p>
    </div>

    <!-- KİLO -->
    <div class="card">
        <h2>📅 Kilo Ekle</h2>
        <input id="kilo" placeholder="Kilo">
        <button onclick="kiloEkle()">Kaydet</button>
    </div>

    <!-- HAREKET -->
    <div class="card">
        <h2>🏋️ Hareket Ekle</h2>
        <input id="hareket" placeholder="bench / squat / deadlift">
        <input id="agirlik" placeholder="kg">
        <button onclick="agirlikEkle()">Ekle</button>
    </div>

    <!-- LİSTE -->
    <div class="card">
        <h2>📜 Kayıtlar</h2>
        <div id="liste"></div>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
