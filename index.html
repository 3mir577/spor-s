<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fitness App</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <button onclick="showPage('home')">🏠 Ana Menü</button>
    <button onclick="showPage('kilo')">⚖️ Kilo</button>
    <button onclick="showPage('agirlik')">🏋️ Ağırlık</button>
</div>

<!-- ANA MENÜ -->
<div id="home" class="page">
    <h1>🔥 Dashboard</h1>

    <div class="card">
        <h2>Bugünkü Kilo</h2>
        <p id="bugunKilo">-</p>
    </div>

    <div class="card">
        <h2>Bench Max</h2>
        <p id="benchMax">-</p>
    </div>

    <div class="card">
        <h2>Squat Max</h2>
        <p id="squatMax">-</p>
    </div>
</div>

<!-- KİLO -->
<div id="kilo" class="page hidden">
    <h1>⚖️ Kilo Takibi</h1>

    <div class="card">
        <input id="kiloInput" placeholder="Kilo gir">
        <button onclick="kiloEkle()">Kaydet</button>
    </div>

    <div class="card">
        <h2>Geçmiş</h2>
        <div id="kiloListe"></div>
    </div>
</div>

<!-- AĞIRLIK -->
<div id="agirlik" class="page hidden">
    <h1>🏋️ Ağırlık Takibi</h1>

    <div class="card">
        <input id="hareket" placeholder="bench / squat">
        <input id="agirlikInput" placeholder="kg">
        <button onclick="agirlikEkle()">Ekle</button>
    </div>

    <div class="card">
        <h2>Geçmiş</h2>
        <div id="agirlikListe"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
